services:
  itemcatalogdb:
    image: postgres

  itemcatalog.api:
    image: ${DOCKER_REGISTRY-}itemcatalogapi
    build:
      context: .
      dockerfile: Services/Catalogs/ItemCatalog.Api/Dockerfile

  authservicedb:
    image: postgres

  authservice.api:
    image: ${DOCKER_REGISTRY-}authserviceapi
    build:
      context: .
      dockerfile: Services/AuthServices/AuthService.Api/Dockerfile

  yarpapigateway:
    image: ${DOCKER_REGISTRY-}yarpapigateway
    build:
      context: .
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile

volumes:
  itemcatalogdb_data:
  authservicedb_data:
